#Point Blank Passthrough Interaction Configuration
[interaction]
	#List of blocks that can be interacted with while holding a weapon
	allowed_blocks = ["#minecraft:doors", "#minecraft:trapdoors", "#minecraft:fence_gates", "#minecraft:buttons", "#minecraft:beds"]
	#List of blocks that should NEVER be interacted with while holding a weapon
	forbidden_blocks = []
	#List of entities that can be interacted with while holding a weapon
	allowed_entities = ["minecraft:item_frame", "minecraft:glow_item_frame"]
	#List of entities that should NEVER be interacted with while holding a weapon
	forbidden_entities = []
	#Show interaction hint text on HUD when looking at interactable blocks/entities
	show_interaction_hud = true
	#Enable debug logging for troubleshooting
	enable_debug_logging = true
	#Enable automatic detection of interactable blocks/entities
	enable_auto_detection = true
	#List of weapon mods that this system should work with
	compatible_weapon_mods = ["pointblank"]
